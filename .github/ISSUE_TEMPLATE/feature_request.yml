name: Feature Request
description: Propose a new offline tool, format conversion, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      options:
        - Android (meld-android)
        - macOS (meld-mac)
        - Both Platforms
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Workflow Need
      placeholder: What task are you trying to complete offline?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Offline Solution
    validations:
      required: true
